title: Render Showcase Roadmap
description: Full rendering showcase with parent spine, left-right children, group containers, choice items, and explicit edges.
nodes:
  - nodeId: FOUNDATION_SPINE
    type: main_topic
    roadmapName: Foundation Spine
    description: Core fundamentals for the whole roadmap.
    parentNodeId: null
    skillName: fundamentals

  - nodeId: PLATFORM_SPINE
    type: main_topic
    roadmapName: Platform Spine
    description: Platform and architecture layer.
    parentNodeId: null
    skillName: platform-thinking

  - nodeId: DELIVERY_SPINE
    type: main_topic
    roadmapName: Delivery Spine
    description: Delivery and operations layer.
    parentNodeId: null
    skillName: delivery

  - nodeId: FE_TRACK
    type: group_container
    roadmapName: Frontend Track
    description: Group for UI and client-side modules.
    parentNodeId: FOUNDATION_SPINE

  - nodeId: BE_TRACK
    type: group_container
    roadmapName: Backend Track
    description: Group for APIs and service modules.
    parentNodeId: FOUNDATION_SPINE

  - nodeId: FE_CORE
    type: sub_topic
    roadmapName: Frontend Core
    description: Components, state, and rendering basics.
    parentNodeId: FOUNDATION_SPINE
    skillName: components

  - nodeId: BE_CORE
    type: sub_topic
    roadmapName: Backend Core
    description: Routing, service layer, and validation.
    parentNodeId: FOUNDATION_SPINE
    skillName: api-design

  - nodeId: DATA_LAYER
    type: sub_topic
    roadmapName: Data Layer
    description: Persistence and schema design.
    parentNodeId: PLATFORM_SPINE
    skillName: schema-design

  - nodeId: OBS_TRACK
    type: sub_topic
    roadmapName: Observability
    description: Logging, metrics, and traces.
    parentNodeId: DELIVERY_SPINE
    skillName: monitoring

  - nodeId: UI_PATH_CHOICE
    type: choice_item
    roadmapName: UI Path Choice
    description: Choose one UI ecosystem as primary.
    parentNodeId: FE_TRACK

  - nodeId: API_STYLE_CHOICE
    type: choice_item
    roadmapName: API Style Choice
    description: Choose REST-first or event-first API style.
    parentNodeId: BE_TRACK

  - nodeId: REACT_PATH
    type: sub_topic
    roadmapName: React Path
    description: React-focused frontend path.
    parentNodeId: UI_PATH_CHOICE

  - nodeId: VUE_PATH
    type: sub_topic
    roadmapName: Vue Path
    description: Vue-focused frontend path.
    parentNodeId: UI_PATH_CHOICE

  - nodeId: REST_PATH
    type: sub_topic
    roadmapName: REST Path
    description: REST API path with contract-driven design.
    parentNodeId: API_STYLE_CHOICE

  - nodeId: EVENT_PATH
    type: sub_topic
    roadmapName: Event-Driven Path
    description: Event-first integration path.
    parentNodeId: API_STYLE_CHOICE

  - nodeId: CAPSTONE
    type: sub_topic
    roadmapName: Capstone Release
    description: Final integrated release milestone.
    parentNodeId: DELIVERY_SPINE
    resources:
      - title: Release Checklist Template
        url: https://example.com/release-checklist
        type: link

edges:
  - id: e_foundation_to_fe_track
    source: FOUNDATION_SPINE
    target: FE_TRACK
    type: default
  - id: e_foundation_to_be_track
    source: FOUNDATION_SPINE
    target: BE_TRACK
    type: default
  - id: e_platform_to_data
    source: PLATFORM_SPINE
    target: DATA_LAYER
    type: dashed
  - id: e_delivery_to_obs
    source: DELIVERY_SPINE
    target: OBS_TRACK
    type: default
  - id: e_choice_ui_to_react
    source: UI_PATH_CHOICE
    target: REACT_PATH
    type: default
  - id: e_choice_api_to_rest
    source: API_STYLE_CHOICE
    target: REST_PATH
    type: default
