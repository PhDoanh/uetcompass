<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#003e79",
                        "on-secondary-container": "#005c75",
                        "surface-container-high": "#dee9fc",
                        "surface-tint": "#185eac",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "outline": "#727782",
                        "on-surface": "#111c2a",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#a7c8ff",
                        "on-primary-fixed-variant": "#004788",
                        "on-tertiary-container": "#bccbeb",
                        "on-error": "#ffffff",
                        "inverse-surface": "#263140",
                        "outline-variant": "#c2c6d3",
                        "inverse-primary": "#a7c8ff",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed-dim": "#b8c7e6",
                        "primary-container": "#0055a2",
                        "secondary-fixed-dim": "#6bd3fc",
                        "on-primary-container": "#aeccff",
                        "secondary-container": "#6ed6ff",
                        "primary-fixed": "#d5e3ff",
                        "on-secondary-fixed": "#001f29",
                        "tertiary-fixed": "#d6e3ff",
                        "surface-container-highest": "#d8e3f6",
                        "on-primary-fixed": "#001b3c",
                        "on-primary": "#ffffff",
                        "surface-dim": "#cfdbee",
                        "surface": "#f8f9ff",
                        "secondary-fixed": "#bce9ff",
                        "on-tertiary-fixed": "#0b1c34",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eaf1ff",
                        "on-error-container": "#93000a",
                        "secondary": "#006783",
                        "tertiary-container": "#475671",
                        "surface-bright": "#f8f9ff",
                        "surface-variant": "#d8e3f6",
                        "on-surface-variant": "#424751",
                        "tertiary": "#303f58",
                        "on-tertiary-fixed-variant": "#384761",
                        "on-background": "#111c2a",
                        "on-secondary-fixed-variant": "#004d63",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Be Vietnam Pro"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .academic-gradient {
            background: linear-gradient(135deg, #003e79 0%, #0055a2 100%);
        }
        .ambient-shadow {
            box-shadow: 0 32px 48px -4px rgba(0, 62, 121, 0.08);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface overflow-hidden">
<!-- Background Content (Blurred) -->
<div class="fixed inset-0 z-0 overflow-hidden select-none pointer-events-none filter blur-md scale-105">
<header class="h-14 flex items-center px-6 border-b border-outline-variant/10">
<span class="text-xl font-bold text-primary font-headline">UETCompass</span>
</header>
<main class="max-w-7xl mx-auto px-8 py-20 space-y-24">
<div class="grid grid-cols-2 gap-12 items-center">
<div class="space-y-6">
<div class="h-4 bg-primary-container/20 rounded-full w-48"></div>
<div class="h-16 bg-primary/10 rounded-xl w-full"></div>
<div class="h-16 bg-primary/10 rounded-xl w-4/5"></div>
<div class="h-6 bg-on-surface-variant/10 rounded-lg w-full"></div>
</div>
<div class="h-80 bg-surface-container rounded-3xl"></div>
</div>
</main>
<div class="absolute inset-0 bg-on-surface/5"></div>
</div>
<!-- Overlay Wrapper -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-on-surface/20 backdrop-blur-sm">
<!-- Reset Password Modal (440px wide) -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl ambient-shadow overflow-hidden relative border border-outline-variant/10">
<!-- Modal Header -->
<div class="px-8 pt-10 pb-6 text-center">
<div class="inline-flex items-center justify-center w-12 h-12 bg-surface-container-low rounded-full mb-4">
<span class="material-symbols-outlined text-primary text-2xl">explore</span>
</div>
<h1 class="font-headline font-bold text-2xl tracking-tight text-on-surface uppercase">UETCompass</h1>
<p class="text-on-surface-variant text-sm mt-1">Thiết lập mật khẩu mới cho tài khoản của bạn</p>
</div>
<!-- Modal Content -->
<div class="px-8 py-8 space-y-6">
<form class="space-y-6" onsubmit="return false">
<!-- New Password Field Group -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface uppercase tracking-tight pl-1">Mật khẩu mới</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg">lock</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-surface-container-low border border-outline-variant/20 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/60" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="pt-2">
<div class="flex justify-between items-center mb-1.5">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Độ mạnh mật khẩu</span>
<span class="text-[10px] font-bold text-error uppercase tracking-wider">Yếu</span>
</div>
<div class="grid grid-cols-3 gap-1.5">
<div class="h-1 rounded-full bg-error"></div>
<div class="h-1 rounded-full bg-outline-variant/30"></div>
<div class="h-1 rounded-full bg-outline-variant/30"></div>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3 academic-gradient text-on-primary font-semibold rounded-lg text-sm shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Đổi mật khẩu
                    </button>
</form>
<!-- Back to Login -->
<div class="text-center">
<a class="text-[11px] font-bold text-primary hover:underline flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                        Quay lại đăng nhập
                    </a>
</div>
</div>
<!-- Modal Footer -->
<div class="px-8 py-6 bg-surface-container-low/50 flex flex-col items-center gap-3">
<p class="text-[10px] text-outline text-center leading-relaxed">
                    © 2024 UET-VNU University of Engineering and Technology. Mọi quyền được bảo lưu.
                </p>
<div class="flex gap-4">
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors" href="#">Trung tâm hỗ trợ</a>
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors" href="#">An ninh</a>
</div>
</div>
</div>
</div>
</body></html>
