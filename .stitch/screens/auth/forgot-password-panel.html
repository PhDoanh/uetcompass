<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#003e79",
                        "on-secondary-container": "#005c75",
                        "surface-container-high": "#dee9fc",
                        "surface-tint": "#185eac",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "outline": "#727782",
                        "on-surface": "#111c2a",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#a7c8ff",
                        "on-primary-fixed-variant": "#004788",
                        "on-tertiary-container": "#bccbeb",
                        "on-error": "#ffffff",
                        "inverse-surface": "#263140",
                        "outline-variant": "#c2c6d3",
                        "inverse-primary": "#a7c8ff",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed-dim": "#b8c7e6",
                        "primary-container": "#0055a2",
                        "secondary-fixed-dim": "#6bd3fc",
                        "on-primary-container": "#aeccff",
                        "secondary-container": "#6ed6ff",
                        "primary-fixed": "#d5e3ff",
                        "on-secondary-fixed": "#001f29",
                        "tertiary-fixed": "#d6e3ff",
                        "surface-container-highest": "#d8e3f6",
                        "on-primary-fixed": "#001b3c",
                        "on-primary": "#ffffff",
                        "surface-dim": "#cfdbee",
                        "surface": "#f8f9ff",
                        "secondary-fixed": "#bce9ff",
                        "on-tertiary-fixed": "#0b1c34",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eaf1ff",
                        "on-error-container": "#93000a",
                        "secondary": "#006783",
                        "tertiary-container": "#475671",
                        "surface-bright": "#f8f9ff",
                        "surface-variant": "#d8e3f6",
                        "on-surface-variant": "#424751",
                        "tertiary": "#303f58",
                        "on-tertiary-fixed-variant": "#384761",
                        "on-background": "#111c2a",
                        "on-secondary-fixed-variant": "#004d63",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Be Vietnam Pro"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .academic-gradient {
            background: linear-gradient(135deg, #003e79 0%, #0055a2 100%);
        }
        .ambient-shadow {
            box-shadow: 0 32px 48px -4px rgba(0, 62, 121, 0.08);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface overflow-hidden" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAn9_L1fXpL9kZ-H5eR9q-pYV_r6iO1uH9T_o3v8zXhQe9f_r4tY5uM6p-w7z-V-fV-H1t6m9w-fV-H1t6m9w'); background-size: cover; background-position: center;">
<!-- Backdrop Blur Overlay -->
<div class="fixed inset-0 bg-black/10 backdrop-blur-md z-0"></div>
<!-- Overlay Wrapper -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
<!-- Forgot Password Modal -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl ambient-shadow overflow-hidden relative border border-outline-variant/10">
<!-- Back Button -->
<button class="absolute top-6 left-6 text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 group z-10">
<span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-label text-xs font-semibold">Quay lại</span>
</button>
<!-- Modal Header -->
<div class="px-8 pt-10 pb-6 text-center">
<div class="inline-flex items-center justify-center w-12 h-12 bg-surface-container-low rounded-full mb-4">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h1 class="font-headline font-bold text-2xl tracking-tight text-on-surface">UETCompass</h1>
<p class="text-on-surface-variant text-sm mt-2 leading-relaxed">
                    Quên mật khẩu? <br/>
                    Nhập email VNU để nhận mã khôi phục.
                </p>
</div>
<!-- Modal Content -->
<div class="px-8 py-8 space-y-6">
<!-- Credentials Form -->
<form class="space-y-6" onsubmit="return false">
<div class="space-y-1.5">
<label class="text-xs font-bold text-on-surface uppercase tracking-tight pl-1">Địa chỉ email vnu</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/20 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/60" placeholder="username@vnu.edu.vn" type="email"/>
</div>
</div>
<button class="w-full py-3.5 academic-gradient text-on-primary font-bold rounded-lg text-sm shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Gửi mã khôi phục
                        <span class="material-symbols-outlined text-lg">send</span>
</button>
</form>
</div>
<!-- Modal Footer -->
<div class="px-8 py-6 bg-surface-container-low/50 flex flex-col items-center gap-3">
<p class="text-[10px] text-outline text-center leading-relaxed">
                    Gặp sự cố khi nhận mã? 
                    <a class="text-primary font-bold hover:underline" href="#">Liên hệ kỹ thuật</a>
</p>
<div class="flex gap-4">
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors" href="#">Trung tâm hỗ trợ</a>
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors" href="#">Chính sách &amp; Điều khoản</a>
</div>
</div>
</div>
</div>
<!-- Background Brand Header (Hidden but functional for layout structure) -->
<header class="fixed top-0 w-full h-14 flex items-center px-6 z-10">
<span class="text-xl font-bold text-primary font-headline">UETCompass</span>
</header>
</body></html>
